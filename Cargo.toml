[workspace]
members = [
    "crates/core",
    "crates/capability-graph",
    "crates/workflow-graph",
    "crates/workflow-recovery",
    "crates/execution-stream",
    "crates/runtime-core",
    "crates/runtime-composition",
    "crates/graph-lab",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Kernis contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
