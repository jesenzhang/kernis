[package]
name = "runtime-core"
description = "Deterministic runtime coordination, declarative reconstruction, and the explicit async driver for the Kernis kernel."
repository = "https://github.com/jesenzhang/kernis"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
capability-graph = { path = "../capability-graph" }
execution-stream = { path = "../execution-stream" }
kernis-core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
workflow-graph = { path = "../workflow-graph" }
workflow-recovery = { path = "../workflow-recovery" }

[dev-dependencies]
redb = "=2.6.3"
tokio = { version = "1.45", features = ["macros", "rt", "sync"] }

[lints]
workspace = true
