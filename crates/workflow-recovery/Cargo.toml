[package]
name = "workflow-recovery"
description = "Durable workflow facts, embedded physical store, and recovery classification for the Kernis runtime kernel."
repository = "https://github.com/jesenzhang/kernis"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
kernis-core = { path = "../core" }
postcard = { version = "1.1.3", features = ["alloc"] }
redb = "=2.6.3"
serde = { version = "1.0", features = ["derive"] }
workflow-graph = { path = "../workflow-graph" }

[lints]
workspace = true
